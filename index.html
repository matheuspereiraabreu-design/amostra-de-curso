<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mercado Mix</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       CABEÇALHO
  ========================== -->

  <header class="glass">

    <div class="logo">
      <img src="logo.png" alt="Mercado Mix">
    </div>

    <div class="search">
      <input
        id="busca"
        type="text"
        placeholder="Buscar produtos..."
      >

      <button onclick="buscar()">
        🔎
      </button>
    </div>

    <button class="account-btn" onclick="abrirLogin()">
      👤 <span id="contaTexto">Entrar</span>
    </button>

    <button class="cart-btn" onclick="abrirCarrinho()">
      🛒 Carrinho
      <span id="contador">0</span>
    </button>

  </header>


  <!-- =========================
       ABAS PRINCIPAIS
  ========================== -->

  <nav class="main-tabs glass">

    <button
      id="tab-Mercado"
      class="main-tab active"
      onclick="abrirAba('Mercado')">
      🛒 Mercado
    </button>

    <button
      id="tab-Esportes"
      class="main-tab"
      onclick="abrirAba('Esportes')">
      ⚽ Esportes
    </button>

    <button
      id="tab-Roupas"
      class="main-tab"
      onclick="abrirAba('Roupas')">
      👕 Roupas
    </button>

    <button
      id="tab-Eletrônicos"
      class="main-tab"
      onclick="abrirAba('Eletrônicos')">
      📱 Eletrônicos
    </button>

    <button
      id="tab-Casa"
      class="main-tab"
      onclick="abrirAba('Casa')">
      🏠 Casa
    </button>

  </nav>


  <!-- =========================
       SUBCATEGORIAS
  ========================== -->

  <nav id="subcategorias" class="categories glass"></nav>


  <!-- =========================
       CONTEÚDO
  ========================== -->

  <main>

    <!-- CARROSSEL DE OFERTAS -->

    <section class="hero glass">

      <button
        class="carousel-btn prev"
        onclick="mudarOferta(-1)">
        ❮
      </button>

      <div class="carousel-content">

        <p class="tag">
          🏷️ OFERTA ESPECIAL
        </p>

        <div id="ofertaEmoji" class="oferta-emoji">
          🥬
        </div>

        <h1 id="ofertaNome">
          Alface
        </h1>

        <div class="oferta-precos">

          <span
            id="ofertaPrecoAntigo"
            class="preco-antigo">
            R$ 3,99
          </span>

          <span
            id="ofertaPreco"
            class="preco-oferta">
            R$ 2,99
          </span>

        </div>

        <button
          class="primary"
          onclick="adicionarOferta()">
          🛒 Adicionar ao carrinho
        </button>

      </div>

      <button
        class="carousel-btn next"
        onclick="mudarOferta(1)">
        ❯
      </button>

      <div
        id="indicadores"
        class="indicadores">
      </div>

    </section>


    <!-- TÍTULO -->

    <section class="section-head">

      <div>

        <h2 id="titulo">
          Todos os produtos
        </h2>

        <p id="quantidade"></p>

      </div>

    </section>


    <!-- PRODUTOS -->

    <section
      id="produtos"
      class="grid">
    </section>

  </main>


  <!-- =========================
       LOGIN
  ========================== -->

  <div
    id="loginModal"
    class="modal hidden"
    onclick="fecharLogin(event)">

    <div
      class="login glass"
      onclick="event.stopPropagation()">

      <button
        class="close"
        onclick="fecharLogin()">
        ✕
      </button>

      <div class="login-icon">
        👤
      </div>

      <h2 id="loginTitulo">
        Entrar na conta
      </h2>

      <p id="loginSubtitulo">
        Entre para efetivar sua conta e finalizar suas compras.
      </p>


      <form
        id="loginForm"
        onsubmit="entrarConta(event)">

        <label for="loginEmail">
          E-mail
        </label>

        <input
          id="loginEmail"
          type="email"
          placeholder="seu@email.com"
          required>

        <label for="loginSenha">
          Senha
        </label>

        <input
          id="loginSenha"
          type="password"
          placeholder="Sua senha"
          minlength="4"
          required>

        <button
          class="primary login-submit"
          type="submit">
          Entrar
        </button>

      </form>


      <button
        class="link-btn"
        onclick="alternarCadastro()">
        Ainda não tenho conta
      </button>

      <button
        class="link-btn hidden"
        id="voltarLogin"
        onclick="alternarCadastro()">
        Já tenho uma conta
      </button>


      <form
        id="cadastroForm"
        class="hidden"
        onsubmit="criarConta(event)">

        <label for="cadNome">
          Nome
        </label>

        <input
          id="cadNome"
          type="text"
          placeholder="Seu nome"
          required>

        <label for="cadEmail">
          E-mail
        </label>

        <input
          id="cadEmail"
          type="email"
          placeholder="seu@email.com"
          required>

        <label for="cadSenha">
          Senha
        </label>

        <input
          id="cadSenha"
          type="password"
          placeholder="Crie uma senha"
          minlength="4"
          required>

        <button
          class="primary login-submit"
          type="submit">
          Criar conta
        </button>

      </form>

    </div>

  </div>


  <!-- =========================
       CARRINHO
  ========================== -->

  <div
    id="modal"
    class="modal hidden"
    onclick="fecharCarrinho(event)">

    <div
      class="cart glass"
      onclick="event.stopPropagation()">

      <button
        class="close"
        onclick="fecharCarrinho()">
        ✕
      </button>

      <h2>
        🛒 Seu carrinho
      </h2>

      <div id="itensCarrinho"></div>

      <div class="total">

        <span>
          Total
        </span>

        <strong id="total">
          R$ 0,00
        </strong>

      </div>

      <button
        class="primary checkout"
        onclick="finalizarCompra()">
        Finalizar compra
      </button>

    </div>

  </div>


  <div id="toast"></div>


  <script src="script.js"></script>

</body>
</html>
